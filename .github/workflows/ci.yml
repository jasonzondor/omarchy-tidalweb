name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: manifest
        run: python3 scripts/validate-manifest.py .

      - name: shell
        run: bash -n bin/omarchy-tidalweb bin/omarchy-tidalweb-setup

      - name: qml
        run: |
          sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
          # qmllint cannot resolve the Quickshell / qs.* modules off-machine;
          # --bare still catches syntax errors and typos.
          qmllint --bare qml/*.qml qml/components/*.qml || true
